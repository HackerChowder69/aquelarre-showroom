services:
  db:
    image: postgres:16-alpine
    container_name: aquelarre_db
    environment:
      POSTGRES_USER: aquelarre
      POSTGRES_PASSWORD: aquelarre
      POSTGRES_DB: aquelarre_db
    ports:
      - "5434:5432"
    volumes:
      - aquelarre_data:/var/lib/postgresql/data
volumes:
  aquelarre_data:
