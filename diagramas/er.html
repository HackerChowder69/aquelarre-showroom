<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=block" rel="stylesheet"><script src="diag.js"></script></head><body><script>
// Modelo entidad-relación conceptual (notación de Chen) — aquelarre_db
const W = 1700, H = 870;
const ent = {
  USUARIO: [130, 330], APARTADO: [560, 330], PRODUCTO: [1100, 330], EMPRENDEDOR: [1560, 330],
  CATEGORIA: [1100, 720], INFORMACION_LOCAL: [215, 735], MENSAJE_CONTACTO: [585, 735],
};
const rel = {
  realiza: { pos: [345, 330], a: "USUARIO", ca: "1", b: "APARTADO", cb: "N" },
  incluye: { pos: [830, 330], a: "APARTADO", ca: "N", b: "PRODUCTO", cb: "M" },
  ofrece: { pos: [1335, 330], a: "EMPRENDEDOR", ca: "1", b: "PRODUCTO", cb: "N" },
  clasifica: { pos: [1100, 535], a: "CATEGORIA", ca: "1", b: "PRODUCTO", cb: "N" },
};
// [nombre, x, y, esLlave, dueño]
const attrs = [
  ["id", 55, 210, 1, "USUARIO"], ["nombre", 150, 165, 0, "USUARIO"], ["correo", 250, 210, 0, "USUARIO"],
  ["rol", 40, 450, 0, "USUARIO"], ["telefono", 140, 495, 0, "USUARIO"], ["contrasena_hash", 255, 450, 0, "USUARIO"],
  ["id", 470, 210, 1, "APARTADO"], ["folio", 560, 165, 0, "APARTADO"], ["estado", 655, 210, 0, "APARTADO"],
  ["nombre_cliente", 455, 455, 0, "APARTADO"], ["fecha_limite", 575, 500, 0, "APARTADO"], ["total", 665, 445, 0, "APARTADO"],
  ["cantidad", 760, 505, 0, "incluye"], ["precio_unitario", 930, 505, 0, "incluye"], ["subtotal", 830, 565, 0, "incluye"],
  ["id", 985, 215, 1, "PRODUCTO"], ["nombre", 1050, 160, 0, "PRODUCTO"], ["precio", 1160, 160, 0, "PRODUCTO"],
  ["existencias", 1235, 215, 0, "PRODUCTO"], ["destacado", 990, 455, 0, "PRODUCTO"], ["activo", 1215, 455, 0, "PRODUCTO"],
  ["id", 1480, 210, 1, "EMPRENDEDOR"], ["nombre_marca", 1600, 165, 0, "EMPRENDEDOR"], ["instagram", 1640, 455, 0, "EMPRENDEDOR"],
  ["responsable", 1490, 470, 0, "EMPRENDEDOR"],
  ["id", 955, 670, 1, "CATEGORIA"], ["nombre", 950, 775, 0, "CATEGORIA"], ["slug", 1245, 670, 0, "CATEGORIA"], ["activa", 1250, 775, 0, "CATEGORIA"],
  ["id", 85, 665, 1, "INFORMACION_LOCAL"], ["direccion", 255, 655, 0, "INFORMACION_LOCAL"], ["horario_atencion", 95, 810, 0, "INFORMACION_LOCAL"],
  ["dias_vigencia_apartado", 340, 810, 0, "INFORMACION_LOCAL"],
  ["id", 480, 665, 1, "MENSAJE_CONTACTO"], ["correo", 650, 655, 0, "MENSAJE_CONTACTO"], ["asunto", 500, 810, 0, "MENSAJE_CONTACTO"], ["leido", 680, 810, 0, "MENSAJE_CONTACTO"],
];
const pos = (k) => ent[k] || rel[k].pos;
let lineas = "", formas = "";
const ln = (a, b, extra = "") => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${C.gris}" stroke-width="1.4" ${extra}/>`;

for (const [n, x, y, pk, d] of attrs) {
  lineas += ln(pos(d), [x, y]);
  const rx = Math.max(40, n.length * 4.6 + 18);
  formas += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="19" fill="${pk ? "#FFF6D6" : "#fff"}" stroke="${pk ? "#C9A227" : C.morado}" stroke-width="1.4"/>`;
  formas += `<text x="${x}" y="${y + 4.5}" font-size="13" text-anchor="middle" fill="${C.tinta}" ${pk ? 'font-weight="700" text-decoration="underline"' : ""}>${n}</text>`;
}
for (const [nombre, r] of Object.entries(rel)) {
  for (const [e, c] of [[r.a, r.ca], [r.b, r.cb]]) {
    const pe = ent[e], pr = r.pos;
    lineas += `<line x1="${pe[0]}" y1="${pe[1]}" x2="${pr[0]}" y2="${pr[1]}" stroke="${C.morado}" stroke-width="2.2"/>`;
    const vertical = pe[0] === pr[0];
    const we = vertical ? 26 : Math.max(150, e.length * 10 + 30) / 2, wd = vertical ? 42 : 78;
    const dir = vertical ? Math.sign(pr[1] - pe[1]) : Math.sign(pr[0] - pe[0]);
    const borde = (vertical ? pe[1] : pe[0]) + dir * we, punta = (vertical ? pr[1] : pr[0]) - dir * wd;
    const medio = (borde + punta) / 2;
    const lx = vertical ? pe[0] + 16 : medio, ly = vertical ? medio + 6 : pe[1] - 10;
    formas += `<text x="${lx}" y="${ly}" font-size="17" font-weight="700" text-anchor="middle" fill="${C.rosa}">${c}</text>`;
  }
  const [x, y] = r.pos, w = 78, h = 42;
  formas += `<polygon points="${x - w},${y} ${x},${y - h} ${x + w},${y} ${x},${y + h}" fill="${C.lavanda}" stroke="${C.morado}" stroke-width="2"/>`;
  formas += `<text x="${x}" y="${y + 5}" font-size="14" font-weight="600" text-anchor="middle" fill="${C.moradoOsc}">${nombre}</text>`;
}
for (const [nombre, [x, y]] of Object.entries(ent)) {
  const w = Math.max(150, nombre.length * 10 + 30);
  formas += `<rect x="${x - w / 2}" y="${y - 26}" width="${w}" height="52" rx="4" fill="${C.morado}" stroke="${C.moradoOsc}" stroke-width="2"/>`;
  formas += `<text x="${x}" y="${y + 6}" font-size="15" font-weight="700" letter-spacing="0.5" text-anchor="middle" fill="#fff">${nombre}</text>`;
}
const caja = `<rect x="18" y="608" width="760" height="240" rx="10" fill="none" stroke="${C.lila}" stroke-width="2" stroke-dasharray="8 6"/><text x="34" y="632" font-size="13" fill="${C.gris}">Entidades de configuración y contacto (sin relaciones)</text>`;
const leyenda = `<g transform="translate(1340,640)"><rect width="340" height="200" rx="10" fill="#fff" stroke="${C.lila}" stroke-width="1.5"/>
<text x="18" y="30" font-size="14" font-weight="700" fill="${C.tinta}">Simbología (Chen)</text>
<rect x="18" y="46" width="60" height="26" rx="3" fill="${C.morado}"/><text x="92" y="64" font-size="13" fill="${C.tinta}">Entidad</text>
<polygon points="18,98 48,82 78,98 48,114" fill="${C.lavanda}" stroke="${C.morado}" stroke-width="1.5"/><text x="92" y="103" font-size="13" fill="${C.tinta}">Relación</text>
<ellipse cx="48" cy="134" rx="30" ry="13" fill="#fff" stroke="${C.morado}" stroke-width="1.4"/><text x="92" y="139" font-size="13" fill="${C.tinta}">Atributo</text>
<ellipse cx="48" cy="170" rx="30" ry="13" fill="#FFF6D6" stroke="#C9A227" stroke-width="1.4"/><text x="48" y="174" font-size="11" font-weight="700" text-decoration="underline" text-anchor="middle">id</text><text x="92" y="175" font-size="13" fill="${C.tinta}">Llave primaria · 1, N, M = cardinalidad</text></g>`;
const titulo = `<text x="22" y="42" font-size="21" font-weight="700" fill="${C.tinta}">Modelo entidad-relación (conceptual) · aquelarre_db</text><text x="22" y="64" font-size="13" fill="${C.gris}">Atributos principales; el detalle completo de cada tabla está en el diccionario de datos (2.2) y en prisma/schema.prisma</text>`;
ajustarPagina(W, H);
document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" font-family="Poppins, 'Segoe UI', sans-serif"><rect width="100%" height="100%" fill="#fff"/>${titulo}${caja}${lineas}${formas}${leyenda}</svg>`;
</script></body></html>
